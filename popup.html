<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plotta - Quick Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="container">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen">
      <div class="header">
        <h1>Plotta</h1>
        <p class="subtitle">Quick Notes Extension</p>
      </div>
      <div class="auth-form">
        <input type="email" id="email" placeholder="Email" class="input">
        <input type="password" id="password" placeholder="Password" class="input">
        <button id="login-btn" class="btn btn-primary">Sign In</button>
        <button id="signup-btn" class="btn btn-secondary">Sign Up</button>
      </div>
    </div>

    <!-- Main Screen -->
    <div id="main-screen" class="screen hidden">
      <div class="header">
        <h2>Create Sticky Note</h2>
        <button id="logout-btn" class="btn-icon" title="Logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>

      <div class="form">
        <input type="text" id="title" placeholder="Title" class="input">
        <textarea id="content" placeholder="Content (supports markdown)" rows="5" class="input"></textarea>

        <!-- Color Picker -->
        <div class="form-group">
          <label class="label">Color</label>
          <div class="color-grid">
            <button class="color-btn active" data-color="#fef08a" style="background: #fef08a;" title="Yellow"></button>
            <button class="color-btn" data-color="#fed7aa" style="background: #fed7aa;" title="Orange"></button>
            <button class="color-btn" data-color="#fecaca" style="background: #fecaca;" title="Red"></button>
            <button class="color-btn" data-color="#fbcfe8" style="background: #fbcfe8;" title="Pink"></button>
            <button class="color-btn" data-color="#ddd6fe" style="background: #ddd6fe;" title="Purple"></button>
            <button class="color-btn" data-color="#bfdbfe" style="background: #bfdbfe;" title="Blue"></button>
            <button class="color-btn" data-color="#bae6fd" style="background: #bae6fd;" title="Sky"></button>
            <button class="color-btn" data-color="#a7f3d0" style="background: #a7f3d0;" title="Green"></button>
          </div>
        </div>

        <!-- Priority -->
        <div class="form-group">
          <label class="label">Priority</label>
          <div class="btn-group">
            <button class="btn-tag" data-priority="low">Low</button>
            <button class="btn-tag active" data-priority="medium">Medium</button>
            <button class="btn-tag" data-priority="high">High</button>
          </div>
        </div>

        <!-- Tags -->
        <div class="form-group">
          <label class="label">Tags</label>
          <div id="tags-container" class="tags-container">
            <input type="text" id="tag-input" placeholder="Add tag..." class="input-sm">
          </div>
          <div id="selected-tags" class="selected-tags"></div>
        </div>

        <!-- Project Selection -->
        <div class="form-group">
          <label class="label">Project</label>
          <select id="project-select" class="input">
            <option value="">Loading projects...</option>
          </select>
        </div>

        <!-- Capture Options -->
        <div class="form-group">
          <label class="label">Capture</label>
          <div class="btn-group">
            <button id="capture-page" class="btn btn-secondary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              </svg>
              Current Page
            </button>
            <button id="capture-selection" class="btn btn-secondary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="21" y1="10" x2="3" y2="10"></line>
                <line x1="21" y1="6" x2="3" y2="6"></line>
                <line x1="21" y1="14" x2="3" y2="14"></line>
                <line x1="21" y1="18" x2="3" y2="18"></line>
              </svg>
              Selection
            </button>
          </div>
        </div>

        <button id="create-btn" class="btn btn-primary btn-large">Create Sticky Note</button>
      </div>

      <div id="message" class="message hidden"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
